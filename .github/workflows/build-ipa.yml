name: Build PhotoVault IPA

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned PhotoVault.ipa
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build PhotoVault (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoVault.xcodeproj \
            -scheme PhotoVault \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package PhotoVault.ipa
        run: |
          mkdir -p out/Payload
          cp -R "build/Release-iphoneos/PhotoVault.app" out/Payload/
          rm -f "out/Payload/PhotoVault.app/embedded.mobileprovision"
          cd out
          zip -qry PhotoVault.ipa Payload
          rm -rf Payload
          ls -lh PhotoVault.ipa

      - name: Upload PhotoVault-ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoVault-ipa
          path: out/PhotoVault.ipa
          if-no-files-found: error
          retention-days: 30
